<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var k = "lety-dani:ui-theme";
          var v = localStorage.getItem(k);
          document.documentElement.dataset.theme =
            v === "bootstrap" ? "bootstrap" : "sunflower-blackcat";
        } catch (e) {
          document.documentElement.dataset.theme = "sunflower-blackcat";
        }
      })();
    </script>
    <link rel="icon" href="/android_192.png" type="image/png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#242019" />
    <title>Sunflower Garden</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var k = 'lety-dani:ui-theme';
          document.documentElement.dataset.theme =
            localStorage.getItem(k) === 'sunflower-blackcat'
              ? 'sunflower-blackcat'
              : 'bootstrap';
        } catch (e) {
          document.documentElement.dataset.theme = 'bootstrap';
        }
      })();
    </script>
    <link rel="icon" href="/android_192.png" type="image/png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d6efd" />
    <title>Lety e Dani</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# Build (allineare al pannello Netlify se usi altri comandi)
[build]
  command = "npm run build-only"
  publish = "dist"

# SPA (Vue Router): al reload su /lista-spesa ecc. serve index.html, altrimenti 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Secrets Scanner: Vite inserisce VITE_* nel JS in dist; anon + URL sono
# chiavi pubbliche previste dal client Supabase — vanno escluse dallo scan.
# NON aggiungere OPENAI_API_KEY qui: non serve al sito statico (solo Supabase secrets per le Edge Functions).
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"
